# The SBML Test Suite oracle (design section 7). r-actions has no workflow
# for it (Q6), so it lives here. The suite is LGPL 2.1 and never committed
# (D5): it is downloaded by tools/fetch-test-suite.sh and cached.
on:
  push:
    branches: [main, master]
  # `labeled` so that adding `full-ci` reruns it with every case.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: test-suite

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test-suite:
    runs-on: ubuntu-latest
    name: test-suite (${{ matrix.shard }})
    # Two shards keep each job under five minutes.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ZUSBML_TEST_SUITE: ${{ github.workspace }}/sbml-test-suite
      ZUSBML_REQUIRE_SUITE: "true"
      ZUSBML_SUITE_REPORT: ${{ github.workspace }}/suite-report.csv
      ZUSBML_SUITE_CORES: "4"
      ZUSBML_SUITE_SHARD: ${{ matrix.shard }}
      # Quick on pull requests: 00966 alone takes minutes (10^5 events), so it
      # runs on main and with the full-ci label, as the r-actions profiles do.
      ZUSBML_SUITE_SKIP: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '00966' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, local::.

      - uses: actions/cache@v4
        with:
          path: sbml-test-suite
          key: sbml-test-suite-${{ hashFiles('tools/fetch-test-suite.sh') }}

      - name: Fetch the SBML Test Suite
        run: tools/fetch-test-suite.sh sbml-test-suite

      - name: Run the suite
        run: testthat::test_local(filter = "suite", stop_on_failure = TRUE)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-report-${{ strategy.job-index }}
          path: suite-report.csv
          if-no-files-found: ignore

  # One shard cannot check the counts in suite-floor.dcf, so this job
  # combines the shards' reports and checks them: the suite cannot shrink
  # without CI failing.
  suite-floors:
    needs: test-suite
    runs-on: ubuntu-latest
    env:
      ZUSBML_SUITE_SKIP: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '00966' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: actions/download-artifact@v4
        with:
          pattern: suite-report-*
          path: reports

      - name: Check the floors
        run: |
          source("tests/testthat/helper-suite.R")
          files <- Sys.glob("reports/*/suite-report.csv")
          if (length(files) != 2) stop("expected 2 shard reports, found ", length(files))
          report <- do.call(rbind, lapply(files, utils::read.csv, colClasses = "character"))
          if (anyDuplicated(report$id)) stop("a case ran in more than one shard")
          floor <- suite_floor("tests/testthat/suite-floor.dcf")
          failures <- suite_floor_failures(report, floor)
          cat(nrow(report), "cases;", sum(report$status == "pass"), "pass;",
              sum(report$status == "refused"), "refused;",
              sum(report$level2 == "pass"), "pass from Level 2\n")
          if (length(failures) > 0) stop(paste(failures, collapse = "\n"))
        shell: Rscript {0}

  # The fifty fixed BioModels (design section 7), downloaded and cached like
  # the suite, in a job of their own so they run alongside it.
  biomodels:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ZUSBML_BIOMODELS: ${{ github.workspace }}/biomodels
      ZUSBML_REQUIRE_BIOMODELS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, local::.

      - uses: actions/cache@v4
        with:
          path: biomodels
          key: biomodels-${{ hashFiles('tools/biomodels.txt', 'tools/fetch-biomodels.sh') }}

      - name: Fetch the BioModels
        run: tools/fetch-biomodels.sh biomodels

      - name: Run the BioModels test
        run: testthat::test_local(filter = "biomodels", stop_on_failure = TRUE)
        shell: Rscript {0}
